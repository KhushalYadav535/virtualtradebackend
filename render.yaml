# Render Blueprint — https://render.com/docs/blueprint-spec
# After deploy, set secrets in Render Dashboard (DATABASE_URL, JWT_*, etc.)

services:
  - type: web
    name: virtualtrade-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://virtualtradefrontend.vercel.app
      - key: FORCE_HTTPS
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
